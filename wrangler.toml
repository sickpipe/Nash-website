# The website, served as static assets by a Cloudflare Worker (no Worker code).
name = "nash-website"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Wrangler runs this before every deploy and dev session, so `npx wrangler deploy`
# (what Cloudflare's Git builds run) produces dist/ on its own.
[build]
command = "node build.mjs"
